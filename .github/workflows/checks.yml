name: Checks
on: [push, pull_request]
jobs:
  media-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/media/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-details
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg for real playback encoding tests
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends ffmpeg
            else
              brew install ffmpeg
            fi
          fi
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra cpu
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync pytest -q -m 'not mysql'
  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: beatit-ci-root
          MYSQL_DATABASE: beatit_test
          MYSQL_USER: beatit
          MYSQL_PASSWORD: beatit-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      BEATIT_TEST_DATABASE_URL: mysql://beatit:beatit-ci-only@127.0.0.1:3306/beatit_test
      DRUM_EXECUTION_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg for managed playback integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra cpu
      - run: uv run --no-sync pytest -q -m mysql
