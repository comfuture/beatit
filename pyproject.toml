[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drum-score"
version = "0.1.0"
description = "Local audio and video to percussion MusicXML and printable SVG"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "numpy>=1.26,<2",
  "soundfile>=0.13,<1",
  "librosa==0.11.0",
  "pretty-midi>=0.2.10,<1",
  "demucs==4.1.0",
  "torch==2.8.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torchaudio==2.8.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torchaudio==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "adtof-pytorch",
  "beat-this==1.1.0",
  "huggingface-hub>=0.30,<3",
  "verovio>=5.6,<7",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
cpu = ["torch==2.8.0; sys_platform == 'linux'", "torchaudio==2.8.0; sys_platform == 'linux'"]
cuda = [
  "torch==2.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torchaudio==2.8.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
drum-score = "transcription.cli:main"

[tool.uv.sources]
adtof-pytorch = { git = "https://github.com/xavriley/ADTOF-pytorch", rev = "85c192e78f716ea0b111cc8a5ee4a8f6a3a4f8a9" }
torch = [
  { index = "torch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
  { index = "torch-cuda", extra = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
  { index = "torch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
  { index = "torch-cuda", extra = "cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.hatch.build.targets.wheel]
packages = ["src/transcription"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
