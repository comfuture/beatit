# Optional CA mount for a managed OCI MySQL endpoint with its own CA.
# The connection URL must include ?ssl_ca=/run/secrets/mysql_ca.
# For OCI-generated certificates with a mismatched hostname, explicitly append
# &ssl_mode=VERIFY_CA; certificate-chain validation stays mandatory.
# Otherwise use VERIFY_IDENTITY (the default) for chain + hostname verification.
services:
  beatit:
    secrets:
      - mysql_ca

secrets:
  mysql_ca:
    file: ${BEATIT_MYSQL_CA_FILE:?Set the absolute path to the MySQL CA certificate}
