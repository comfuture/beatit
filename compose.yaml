name: beatit

services:
  beatit:
    build: .
    image: ${BEATIT_IMAGE:-beatit:local}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${BEATIT_BIND_ADDRESS:-127.0.0.1}:${BEATIT_PORT:-18000}:8000"
    environment:
      DRUM_EXECUTION_BACKEND: ${BEATIT_EXECUTION_BACKEND:-local}
      BEATIT_MODAL_APP: ${BEATIT_MODAL_APP:-beatit}
      BEATIT_MODAL_IMAGE: ${BEATIT_MODAL_IMAGE:-beatit-processing:py312-cu128-volume-8e06b89eeb19-v1}
      MODAL_ENVIRONMENT: ${MODAL_ENVIRONMENT:-main}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
      ALLOWED_HOSTS: ${BEATIT_ALLOWED_HOSTS:-localhost}
      BEATIT_PUBLIC_URL: ${BEATIT_PUBLIC_URL:?Set the canonical HTTPS application origin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set the Beatit Google OAuth client ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set the Beatit Google OAuth client secret}
      BEATIT_DATABASE_URL: ${BEATIT_DATABASE_URL:?Set the dedicated managed MySQL connection URL}
      BEATIT_DB_POOL_SIZE: ${BEATIT_DB_POOL_SIZE:-6}
      BEATIT_MEDIA_BASE_URL: ${BEATIT_MEDIA_BASE_URL:-}
      BEATIT_S3_ENDPOINT: ${BEATIT_S3_ENDPOINT:?Set the private object storage endpoint}
      BEATIT_S3_REGION: ${BEATIT_S3_REGION:-auto}
      BEATIT_S3_BUCKET: ${BEATIT_S3_BUCKET:?Set the private Beatit bucket}
      BEATIT_S3_ACCESS_KEY_ID: ${BEATIT_S3_ACCESS_KEY_ID:?Set the bucket access key}
      BEATIT_S3_SECRET_ACCESS_KEY: ${BEATIT_S3_SECRET_ACCESS_KEY:?Set the bucket secret key}
      BEATIT_MAX_PENDING_PER_USER: ${BEATIT_MAX_PENDING_PER_USER:-3}
      BEATIT_LEASE_SECONDS: ${BEATIT_LEASE_SECONDS:-90}
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMBA_NUM_THREADS: "2"
    volumes:
      - data:/app/data
      - model-cache:/home/beatit/.cache
    cpus: 2.0
    mem_limit: 12g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
  model-cache:
